<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open Video Downloader</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="../ui/picker.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-32.png" alt="" width="20" height="20">
    <div class="heading">
      <strong>Open Video Downloader</strong>
      <span class="connection" id="connection"><span class="dot"></span><span id="connection-text">Checking…</span></span>
    </div>
    <button type="button" id="open-app" title="Open the app">Open app</button>
  </header>

  <div class="banner" id="banner" hidden></div>
  <section class="page" id="page" aria-live="polite"></section>

  <section class="downloads">
    <h2>Downloads</h2>
    <ul id="list"></ul>
    <p class="empty" id="empty">Nothing downloading yet.</p>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
